plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group
base.archivesName = mod_id

java.toolchain.languageVersion = JavaLanguageVersion.of(java_target)
compileJava.options.compilerArgs.add '-parameters'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories { mavenCentral() }

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test { useJUnitPlatform() }

neoForge {
    version = neoforge_version
    runs {
        client { client() }
        server {
            server()
            programArgument '-nogui'
        }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

tasks.withType(ProcessResources).configureEach {
    inputs.property 'version', version
    inputs.property 'mod_id', mod_id
    inputs.property 'mod_name', mod_name
    inputs.property 'mod_license', mod_license
    inputs.property 'mod_authors', mod_authors
    inputs.property 'mod_description', mod_description
    filesMatching('META-INF/neoforge.mods.toml') {
        expand project.properties
    }
}
